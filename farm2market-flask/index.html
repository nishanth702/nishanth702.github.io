<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm2Market — Shop</title>
<style>
:root{
  --bg:#FAF8F2;
  --surface:#FFFFFF;
  --ink:#22291F;
  --dim:#69735F;
  --border:#E4E0D2;
  --green:#3F7A48;
  --green-dark:#2E5C36;
  --clay:#C97A46;
  --error:#B5453A;
  --radius:12px;
  --shadow:0 12px 30px -18px rgba(30,40,20,0.35);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height:1.55;
}
a{ color:var(--green-dark); text-decoration:none; }
a:hover{ text-decoration:underline; }
.wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }
img{ max-width:100%; display:block; }

.site-header{ background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
.header-inner{ display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 24px; flex-wrap:wrap; }
.brand{ font-size:20px; font-weight:700; color:var(--green-dark); }
.brand:hover{ text-decoration:none; }
.main-nav{ display:flex; gap:20px; }
.main-nav a{ color:var(--ink); font-weight:500; font-size:14.5px; }
.header-actions{ display:flex; align-items:center; gap:14px; }
.cart-link{ color:var(--ink); font-weight:500; position:relative; }
.badge{ background:var(--clay); color:#fff; font-size:11px; padding:1px 6px; border-radius:20px; margin-left:4px; }
.hello{ font-size:14px; color:var(--dim); }

.btn{ display:inline-block; padding:10px 18px; border-radius:8px; border:1px solid transparent; font-weight:600; font-size:14.5px; cursor:pointer; }
.btn-primary{ background:var(--green); color:#fff; }
.btn-primary:hover{ background:var(--green-dark); text-decoration:none; }
.btn-ghost{ background:transparent; border-color:var(--border); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--green); text-decoration:none; }
.btn-sm{ padding:6px 12px; font-size:13px; }
.btn-block{ width:100%; text-align:center; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

.flash-stack{ padding-top:16px; display:flex; flex-direction:column; gap:8px; }
.flash{ padding:12px 16px; border-radius:8px; font-size:14px; }
.flash-success{ background:#E4F1E4; color:var(--green-dark); border:1px solid #BFE0C2; }
.flash-error{ background:#FBE7E4; color:var(--error); border:1px solid #F1C6BF; }

.page{ padding:40px 0 80px; min-height:60vh; }

.hero{ padding:20px 0 36px; border-bottom:1px solid var(--border); margin-bottom:28px; }
.hero h1{ font-size:clamp(28px,4vw,40px); margin:0 0 10px; color:var(--green-dark); }
.hero p{ color:var(--dim); max-width:520px; margin:0; }

.filter-bar{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
.search-form{ display:flex; gap:8px; }
.search-form input{ padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; min-width:220px; }
.category-pills{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{ padding:6px 14px; border-radius:20px; border:1px solid var(--border); font-size:13px; color:var(--dim); }
.pill.active, .pill:hover{ background:var(--green); border-color:var(--green); color:#fff; text-decoration:none; }

.product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:22px; }
.product-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; }
.product-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.product-image-link img{ width:100%; height:150px; object-fit:cover; }
.product-body{ padding:16px; display:flex; flex-direction:column; gap:6px; flex-grow:1; }
.product-category{ font-size:11.5px; color:var(--clay); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; }
.product-body h3{ margin:0; font-size:16.5px; }
.product-body h3 a{ color:var(--ink); }
.product-farmer{ font-size:13px; color:var(--dim); margin:0; }
.product-row{ display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px; }
.price{ font-weight:700; color:var(--green-dark); font-size:16px; }
.price-lg{ font-size:22px; }
.stock{ font-size:12.5px; color:var(--dim); }
.stock-out{ color:var(--error); }

.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start; }
.detail-image{ border-radius:var(--radius); width:100%; max-height:420px; object-fit:cover; }
.detail-info h1{ margin:8px 0 4px; }
.detail-desc{ color:var(--dim); margin:14px 0; }
.detail-price-row{ display:flex; align-items:center; gap:16px; margin-bottom:18px; }
.qty-form{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.qty-form input{ width:70px; padding:8px; border:1px solid var(--border); border-radius:8px; }
.back-link{ display:inline-block; margin-top:10px; font-size:14px; }

.auth-card{ max-width:420px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; box-shadow:var(--shadow); }
.auth-card h1{ margin-top:0; font-size:24px; color:var(--green-dark); }
.auth-form{ display:flex; flex-direction:column; gap:6px; }
.auth-form label{ font-size:13px; font-weight:600; margin-top:10px; color:var(--dim); }
.auth-form input, .auth-form select, .auth-form textarea{ padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14.5px; font-family:inherit; }
.auth-form button{ margin-top:20px; }
.role-choice{ display:flex; gap:18px; margin-top:6px; }
.role-option{ font-weight:400 !important; display:flex; align-items:center; gap:6px; margin-top:0 !important; }
.auth-switch{ text-align:center; margin-top:18px; font-size:14px; color:var(--dim); }
.demo-hint{ font-size:12.5px; color:var(--dim); margin-top:14px; background:#F2F0E6; padding:10px 12px; border-radius:8px; }
.demo-hint code{ background:#fff; padding:1px 5px; border-radius:4px; }

.page-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.listing-table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.listing-table th, .listing-table td{ padding:12px 16px; text-align:left; border-bottom:1px solid var(--border); font-size:14.5px; }
.listing-table th{ background:#F2F0E6; font-size:12.5px; text-transform:uppercase; color:var(--dim); }
.listing-name{ display:flex; align-items:center; gap:10px; }
.listing-name img{ width:36px; height:36px; object-fit:cover; border-radius:6px; }

.cart-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
.cart-row{ display:grid; grid-template-columns:56px 1fr auto auto auto; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; }
.cart-row img{ width:56px; height:56px; object-fit:cover; border-radius:8px; }
.cart-row-info h3{ margin:0 0 2px; font-size:15.5px; }
.dim{ color:var(--dim); }
.cart-qty-form{ display:flex; gap:6px; align-items:center; }
.cart-qty-form input{ width:56px; padding:6px; border:1px solid var(--border); border-radius:6px; }
.cart-subtotal{ font-weight:700; color:var(--green-dark); }
.cart-summary{ display:flex; justify-content:space-between; align-items:center; padding:18px 20px; background:#F2F0E6; border-radius:10px; margin-bottom:20px; }

.empty-state{ color:var(--dim); text-align:center; padding:60px 20px; }

.site-footer{ border-top:1px solid var(--border); padding:24px 0; text-align:center; font-size:13px; color:var(--dim); }
.site-footer .dim{ display:block; margin-top:4px; font-size:12px; }

@media (max-width:760px){
  .detail-grid{ grid-template-columns:1fr; }
  .cart-row{ grid-template-columns:48px 1fr; grid-template-areas:"img info" "qty qty" "sub sub" "rm rm"; row-gap:8px; }
  .main-nav{ display:none; }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#/" class="brand">🌱 Farm2Market</a>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="header-actions" id="headerActions"></div>
    </div>
  </header>

  <div class="wrap flash-stack" id="flashStack"></div>

  <main class="wrap page" id="appBody"></main>

  <footer class="site-footer">
    <div class="wrap">
      Farm2Market — a transparent marketplace connecting farmers directly with buyers.
      <span class="dim">Static client-side SQLite mock build.</span>
    </div>
  </footer>

  <script>
    // -------------------------------------------------------------
    // Mock Database Setup (localStorage keys: f2m_users, f2m_products, f2m_orders)
    // -------------------------------------------------------------
    const default_users = [
      { id: 1, name: "Demo Farmer", email: "farmer@farm2market.demo", password: "farmer123", role: "farmer" },
      { id: 2, name: "Demo Buyer", email: "buyer@farm2market.demo", password: "buyer123", role: "buyer" }
    ];

    const default_products = [
      { id: 1, name: "Farm Fresh Eggs", description: "Free-range eggs collected daily.", price: 8.99, stock: 40, image: "WD-eggs.jpg", category: "Dairy & Eggs", farmer_id: 1 },
      { id: 2, name: "Ripe Bananas", description: "Naturally ripened, no artificial gas.", price: 3.49, stock: 60, image: "WD-bananas.jpg", category: "Fruits", farmer_id: 1 },
      { id: 3, name: "Vine Tomatoes", description: "Sun-grown and picked at peak ripeness.", price: 4.25, stock: 50, image: "WD-Tomatos.jpg", category: "Vegetables", farmer_id: 1 },
      { id: 4, name: "Whole Wheat Bread", description: "Stone-milled flour, baked fresh.", price: 5.75, stock: 25, image: "WD-Bread.jpg", category: "Bakery", farmer_id: 1 },
      { id: 5, name: "Farmstead Cheese", description: "Small-batch cheese from grass-fed cows.", price: 9.99, stock: 20, image: "WD-Cheese.jpg", category: "Dairy & Eggs", farmer_id: 1 },
      { id: 6, name: "Whole Milk", description: "Pasteurized, non-homogenized.", price: 3.99, stock: 35, image: "WD-Milk.jpg", category: "Dairy & Eggs", farmer_id: 1 },
      { id: 7, name: "Organic Pears", description: "Crisp and juicy, orchard-grown.", price: 4.50, stock: 45, image: "WD-Pears.jpg", category: "Fruits", farmer_id: 1 },
      { id: 8, name: "Basmati Rice", description: "Aged for aroma, sold by the farmer directly.", price: 12.00, stock: 100, image: "WD-Rice.jpg", category: "Grains", farmer_id: 1 },
      { id: 9, name: "Baby Potatoes", description: "Hand-harvested, washed and ready to cook.", price: 3.75, stock: 70, image: "WD-potatoes.jpg", category: "Vegetables", farmer_id: 1 }
    ];

    function initDatabase() {
      if (!localStorage.getItem("f2m_users")) {
        localStorage.setItem("f2m_users", JSON.stringify(default_users));
      }
      if (!localStorage.getItem("f2m_products")) {
        localStorage.setItem("f2m_products", JSON.stringify(default_products));
      }
      if (!localStorage.getItem("f2m_orders")) {
        localStorage.setItem("f2m_orders", JSON.stringify([]));
      }
    }
    initDatabase();

    // Session helper
    function getSessionUser() {
      const u = sessionStorage.getItem("f2m_current_user");
      return u ? JSON.parse(u) : null;
    }

    function setSessionUser(user) {
      if (user) sessionStorage.setItem("f2m_current_user", JSON.stringify(user));
      else sessionStorage.removeItem("f2m_current_user");
    }

    // Cart helper
    function getCart() {
      const c = sessionStorage.getItem("f2m_cart");
      return c ? JSON.parse(c) : {}; // { productId: qty }
    }

    function saveCart(cart) {
      sessionStorage.setItem("f2m_cart", JSON.stringify(cart));
    }

    function getCartCount() {
      const cart = getCart();
      return Object.values(cart).reduce((sum, q) => sum + q, 0);
    }

    // Database accessors
    function getUsers() { return JSON.parse(localStorage.getItem("f2m_users")); }
    function saveUsers(users) { localStorage.setItem("f2m_users", JSON.stringify(users)); }

    function getProducts() { return JSON.parse(localStorage.getItem("f2m_products")); }
    function saveProducts(prods) { localStorage.setItem("f2m_products", JSON.stringify(prods)); }

    function getOrders() { return JSON.parse(localStorage.getItem("f2m_orders")); }
    function saveOrders(orders) { localStorage.setItem("f2m_orders", JSON.stringify(orders)); }

    // Alert helper
    function triggerFlash(msg, type = "success") {
      const stack = document.getElementById("flashStack");
      stack.innerHTML = `<div class="flash flash-${type}">${msg}</div>`;
      setTimeout(() => { stack.innerHTML = ""; }, 5000);
    }

    // -------------------------------------------------------------
    // Page Rendering Logic
    // -------------------------------------------------------------
    const appBody = document.getElementById("appBody");
    const mainNav = document.getElementById("mainNav");
    const headerActions = document.getElementById("headerActions");

    function updateHeader() {
      const user = getSessionUser();
      const count = getCartCount();

      // Main Navigation
      let navHtml = `<a href="#/">Shop</a>`;
      if (user && user.role === "farmer") {
        navHtml += `<a href="#/dashboard">My Listings</a>`;
      } else if (user && user.role === "buyer") {
        navHtml += `<a href="#/orders">My Orders</a>`;
      }
      mainNav.innerHTML = navHtml;

      // Header Actions
      let actionsHtml = "";
      if (user) {
        actionsHtml = `
          <a href="#/cart" class="cart-link">🛒 Cart${count ? ` <span class="badge">${count}</span>` : ""}</a>
          <span class="hello">Hi, ${user.name.split(" ")[0]}</span>
          <button onclick="handleLogout()" class="btn btn-ghost btn-sm">Log out</button>
        `;
      } else {
        actionsHtml = `
          <a href="#/cart" class="cart-link">🛒 Cart${count ? ` <span class="badge">${count}</span>` : ""}</a>
          <a href="#/login" class="btn btn-ghost btn-sm">Log in</a>
          <a href="#/signup" class="btn btn-primary btn-sm">Sign up</a>
        `;
      }
      headerActions.innerHTML = actionsHtml;
    }

    function handleLogout() {
      setSessionUser(null);
      sessionStorage.removeItem("f2m_cart");
      triggerFlash("You've been logged out.", "success");
      window.location.hash = "#/";
    }

    // Router
    function router() {
      updateHeader();
      const hash = window.location.hash || "#/";
      
      if (hash === "#/") {
        renderStorefront();
      } else if (hash.startsWith("#/product/")) {
        const id = parseInt(hash.replace("#/product/", ""));
        renderProductDetail(id);
      } else if (hash === "#/cart") {
        renderCart();
      } else if (hash === "#/checkout") {
        renderCheckout();
      } else if (hash === "#/orders") {
        renderOrderHistory();
      } else if (hash.startsWith("#/order/")) {
        const id = parseInt(hash.replace("#/order/", ""));
        renderOrderConfirmation(id);
      } else if (hash === "#/login") {
        renderLogin();
      } else if (hash === "#/signup") {
        renderSignup();
      } else if (hash === "#/dashboard") {
        renderDashboard();
      } else if (hash === "#/products/new") {
        renderNewProduct();
      } else {
        appBody.innerHTML = `<div class="empty-state">404 — Page Not Found</div>`;
      }
    }

    window.addEventListener("hashchange", router);
    window.addEventListener("load", router);

    // 1. Storefront
    function renderStorefront() {
      const prods = getProducts();
      const params = new URLSearchParams(window.location.search || window.location.hash.split("?")[1]);
      const q = (params.get("q") || "").toLowerCase().trim();
      const category = (params.get("category") || "").trim();

      const categories = Array.from(new Set(prods.map(p => p.category))).sort();

      const filteredProds = prods.filter(p => {
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q);
        const matchC = !category || p.category === category;
        return matchQ && matchC;
      });

      let categoriesHtml = `<a href="#/" class="pill ${!category ? "active" : ""}">All</a>`;
      categories.forEach(c => {
        categoriesHtml += `<a href="#/?category=${encodeURIComponent(c)}" class="pill ${category === c ? "active" : ""}">${c}</a>`;
      });

      let productsGrid = "";
      if (filteredProds.length > 0) {
        filteredProds.forEach(p => {
          productsGrid += `
            <article class="product-card">
              <a href="#/product/${p.id}" class="product-image-link">
                <img src="static/images/${p.image}" alt="${p.name}">
              </a>
              <div class="product-body">
                <span class="product-category">${p.category}</span>
                <h3><a href="#/product/${p.id}">${p.name}</a></h3>
                <p class="product-farmer">by Demo Farmer</p>
                <div class="product-row">
                  <span class="price">₹${p.price.toFixed(2)}</span>
                  <span class="stock ${p.stock === 0 ? "stock-out" : ""}">
                    ${p.stock > 0 ? `${p.stock} in stock` : "Out of stock"}
                  </span>
                </div>
                <button onclick="addToCart(${p.id}, 1)" class="btn btn-primary btn-block" ${p.stock === 0 ? "disabled" : ""}>
                  Add to Cart
                </button>
              </div>
            </article>
          `;
        });
      } else {
        productsGrid = `<div class="empty-state" style="grid-column:1/-1;">No products match your filter yet.</div>`;
      }

      appBody.innerHTML = `
        <section class="hero">
          <h1>Buy direct from the farm.</h1>
          <p>No middlemen, no markup games — just fresh produce, priced transparently by the people who grow it.</p>
        </section>

        <section class="filter-bar">
          <form onsubmit="handleSearch(event)" class="search-form">
            <input type="text" id="searchInput" placeholder="Search products…" value="${q}">
            <button type="submit" class="btn btn-primary btn-sm">Search</button>
          </form>
          <div class="category-pills">
            ${categoriesHtml}
          </div>
        </section>

        <section class="product-grid">
          ${productsGrid}
        </section>
      `;
    }

    function handleSearch(e) {
      e.preventDefault();
      const q = document.getElementById("searchInput").value.trim();
      window.location.hash = q ? `#/?q=${encodeURIComponent(q)}` : "#/";
    }

    function addToCart(pid, qty) {
      const prods = getProducts();
      const product = prods.find(p => p.id === pid);
      if (!product) return;

      const cart = getCart();
      const currentQty = cart[pid] || 0;
      const targetQty = currentQty + qty;

      if (targetQty > product.stock) {
        triggerFlash(`Cannot add more. Only ${product.stock} items in stock.`, "error");
        return;
      }

      cart[pid] = targetQty;
      saveCart(cart);
      triggerFlash(`Added ${product.name} to your cart.`, "success");
      updateHeader();
    }

    // 2. Product Detail
    function renderProductDetail(id) {
      const prods = getProducts();
      const p = prods.find(item => item.id === id);
      if (!p) {
        appBody.innerHTML = `<div class="empty-state">Product not found.</div>`;
        return;
      }

      appBody.innerHTML = `
        <a href="#/" class="back-link">← Back to Catalog</a>
        <div class="detail-grid" style="margin-top: 20px;">
          <img src="static/images/${p.image}" class="detail-image" alt="${p.name}">
          <div class="detail-info">
            <span class="product-category">${p.category}</span>
            <h1>${p.name}</h1>
            <p class="product-farmer" style="font-size:15px; margin-bottom:15px;">by Demo Farmer</p>
            <div class="detail-price-row">
              <span class="price price-lg">₹${p.price.toFixed(2)}</span>
              <span class="stock ${p.stock === 0 ? "stock-out" : ""}">
                ${p.stock > 0 ? `${p.stock} in stock` : "Out of stock"}
              </span>
            </div>
            <p class="detail-desc">${p.description || "No description provided."}</p>
            
            <div class="qty-form">
              <label for="detailQty">Quantity:</label>
              <input type="number" id="detailQty" value="1" min="1" max="${p.stock}" ${p.stock === 0 ? "disabled" : ""}>
            </div>

            <button onclick="handleDetailAddToCart(${p.id})" class="btn btn-primary" ${p.stock === 0 ? "disabled" : ""}>
              Add to Cart
            </button>
          </div>
        </div>
      `;
    }

    function handleDetailAddToCart(pid) {
      const qtyInput = document.getElementById("detailQty");
      const qty = parseInt(qtyInput.value) || 1;
      addToCart(pid, qty);
    }

    // 3. Cart View
    function renderCart() {
      const cart = getCart();
      const prods = getProducts();
      const items = [];
      let total = 0.0;

      Object.entries(cart).forEach(([pidStr, qty]) => {
        const pid = parseInt(pidStr);
        const product = prods.find(p => p.id === pid);
        if (product) {
          const subtotal = product.price * qty;
          total += subtotal;
          items.append; // JS syntax helper placeholder
          items.push({ product, quantity: qty, subtotal });
        }
      });

      if (items.length === 0) {
        appBody.innerHTML = `
          <div class="empty-state">
            <h2>Your cart is empty.</h2>
            <p>Go back to the shop to discover fresh organic products!</p>
            <a href="#/" class="btn btn-primary" style="margin-top:15px;">Go Shopping</a>
          </div>
        `;
        return;
      }

      let cartRowsHtml = "";
      items.forEach(item => {
        cartRowsHtml += `
          <div class="cart-row">
            <img src="static/images/${item.product.image}" alt="${item.product.name}">
            <div class="cart-row-info">
              <h3><a href="#/product/${item.product.id}">${item.product.name}</a></h3>
              <span class="dim">Category: ${item.product.category}</span>
            </div>
            <div class="cart-qty-form">
              <input type="number" value="${item.quantity}" min="1" max="${item.product.stock}" onchange="updateCartQty(${item.product.id}, this.value)">
            </div>
            <span class="cart-subtotal">₹${item.subtotal.toFixed(2)}</span>
            <button onclick="removeCartItem(${item.product.id})" class="btn btn-ghost btn-sm" style="color:var(--error); border-color:transparent;">Remove</button>
          </div>
        `;
      });

      appBody.innerHTML = `
        <div class="page-head">
          <h1>Your Shopping Cart</h1>
        </div>
        <div class="cart-list">
          ${cartRowsHtml}
        </div>
        <div class="cart-summary">
          <div>
            <span class="dim" style="font-size:15px;">Basket Total:</span>
            <div style="font-size:24px; font-weight:700; color:var(--green-dark);">₹${total.toFixed(2)}</div>
          </div>
          <a href="#/checkout" class="btn btn-primary">Proceed to Checkout</a>
        </div>
      `;
    }

    function updateCartQty(pid, val) {
      const qty = parseInt(val) || 1;
      const cart = getCart();
      const prods = getProducts();
      const product = prods.find(p => p.id === pid);

      if (product) {
        cart[pid] = Math.min(qty, product.stock);
        saveCart(cart);
        renderCart();
        updateHeader();
      }
    }

    function removeCartItem(pid) {
      const cart = getCart();
      delete cart[pid];
      saveCart(cart);
      renderCart();
      updateHeader();
    }

    // 4. Checkout View
    function renderCheckout() {
      const user = getSessionUser();
      if (!user) {
        triggerFlash("Please log in to continue.", "error");
        window.location.hash = "#/login?next=checkout";
        return;
      }
      if (user.role !== "buyer") {
        triggerFlash("Only buyers can check out.", "error");
        window.location.hash = "#/";
        return;
      }

      const cart = getCart();
      const prods = getProducts();
      const items = [];
      let total = 0.0;

      Object.entries(cart).forEach(([pidStr, qty]) => {
        const pid = parseInt(pidStr);
        const product = prods.find(p => p.id === pid);
        if (product) {
          const subtotal = product.price * qty;
          total += subtotal;
          items.push({ product, quantity: qty, subtotal });
        }
      });

      if (items.length === 0) {
        window.location.hash = "#/";
        return;
      }

      let orderReviewHtml = "";
      items.forEach(item => {
        orderReviewHtml += `
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:14.5px;">
            <span>${item.product.name} x ${item.quantity}</span>
            <span style="font-weight:600;">₹${item.subtotal.toFixed(2)}</span>
          </div>
        `;
      });

      appBody.innerHTML = `
        <div class="auth-card" style="max-width:540px;">
          <h1>Complete Your Purchase</h1>
          <p class="dim" style="margin-top:-6px; margin-bottom:20px;">Review your items and place your order.</p>
          
          <div style="background:#F2F0E6; padding:16px; border-radius:8px; margin-bottom:20px;">
            <h4 style="margin:0 0 10px 0; text-transform:uppercase; color:var(--dim); font-size:12px;">Order Summary</h4>
            ${orderReviewHtml}
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:18px; margin-top:12px; color:var(--green-dark);">
              <span>Grand Total</span>
              <span>₹${total.toFixed(2)}</span>
            </div>
          </div>

          <form onsubmit="handlePlaceOrder(event)" class="auth-form">
            <label>Recipient Name</label>
            <input type="text" id="coName" value="${user.name}" required>
            
            <label>Shipping Address</label>
            <textarea id="coAddress" rows="3" placeholder="Enter delivery address..." required></textarea>

            <button type="submit" class="btn btn-primary btn-block">Place Order</button>
          </form>
        </div>
      `;
    }

    function handlePlaceOrder(e) {
      e.preventDefault();
      const cart = getCart();
      const prods = getProducts();
      const orders = getOrders();
      const user = getSessionUser();

      const items = [];
      let total = 0.0;

      // Validate stock first
      for (const [pidStr, qty] of Object.entries(cart)) {
        const pid = parseInt(pidStr);
        const p = prods.find(item => item.id === pid);
        if (!p || p.stock < qty) {
          triggerFlash(`Product '${p ? p.name : pid}' is out of stock.`, "error");
          return;
        }
      }

      // Deduct stock and assemble order items
      Object.entries(cart).forEach(([pidStr, qty]) => {
        const pid = parseInt(pidStr);
        const p = prods.find(item => item.id === pid);
        p.stock = Math.max(p.stock - qty, 0);
        const subtotal = p.price * qty;
        total += subtotal;
        items.push({
          product_id: p.id,
          product_name: p.name,
          unit_price: p.price,
          quantity: qty
        });
      });

      // Save updated stock
      saveProducts(prods);

      const orderId = orders.length + 1001;
      const newOrder = {
        id: orderId,
        buyer_id: user.id,
        buyer_name: document.getElementById("coName").value.trim(),
        address: document.getElementById("coAddress").value.trim(),
        total: total,
        status: "Placed",
        created_at: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }),
        items: items
      };

      orders.push(newOrder);
      saveOrders(orders);

      sessionStorage.removeItem("f2m_cart");
      triggerFlash("Order placed! Thanks for buying direct from the farm.", "success");
      window.location.hash = `#/order/${orderId}`;
    }

    // 5. Order Confirmation
    function renderOrderConfirmation(orderId) {
      const orders = getOrders();
      const order = orders.find(o => o.id === orderId);
      if (!order) {
        appBody.innerHTML = `<div class="empty-state">Order not found.</div>`;
        return;
      }

      let orderRowsHtml = "";
      order.items.forEach(item => {
        orderRowsHtml += `
          <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14.5px;">
            <span>${item.product_name} x ${item.quantity}</span>
            <span>₹${(item.unit_price * item.quantity).toFixed(2)}</span>
          </div>
        `;
      });

      appBody.innerHTML = `
        <div style="max-width:600px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; box-shadow:var(--shadow);">
          <div style="text-align:center; margin-bottom:24px;">
            <div style="background:#E4F1E4; color:var(--green-dark); width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 12px;">✓</div>
            <h1 style="color:var(--green-dark); margin:0 0 6px 0;">Order Confirmed!</h1>
            <p class="dim" style="margin:0;">Order ID: #${order.id} | Date: ${order.created_at}</p>
          </div>
          
          <div style="margin-bottom:20px;">
            <h4 style="margin:0 0 8px 0; text-transform:uppercase; color:var(--dim); font-size:12px;">Shipping Details</h4>
            <div style="font-weight:600; font-size:15px;">${order.buyer_name}</div>
            <div class="dim" style="font-size:14px; margin-top:2px;">${order.address}</div>
          </div>
          
          <div style="margin-bottom:24px;">
            <h4 style="margin:0 0 8px 0; text-transform:uppercase; color:var(--dim); font-size:12px;">Items Ordered</h4>
            ${orderRowsHtml}
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:18px; margin-top:16px; color:var(--green-dark);">
              <span>Total Paid</span>
              <span>₹${order.total.toFixed(2)}</span>
            </div>
          </div>

          <a href="#/" class="btn btn-primary btn-block">Back to Storefront</a>
        </div>
      `;
    }

    // 6. Order History
    function renderOrderHistory() {
      const user = getSessionUser();
      if (!user) {
        window.location.hash = "#/login";
        return;
      }

      const orders = getOrders().filter(o => o.buyer_id === user.id);

      if (orders.length === 0) {
        appBody.innerHTML = `
          <div class="empty-state">
            <h2>You haven't placed any orders yet.</h2>
            <a href="#/" class="btn btn-primary" style="margin-top:15px;">Browse Storefront</a>
          </div>
        `;
        return;
      }

      let orderListHtml = "";
      orders.forEach(o => {
        let itemsSummary = o.items.map(i => `${i.product_name} (${i.quantity})`).join(", ");
        if (itemsSummary.length > 80) itemsSummary = itemsSummary.slice(0, 80) + "...";

        orderListHtml += `
          <tr>
            <td>#${o.id}</td>
            <td>${o.created_at}</td>
            <td class="dim">${itemsSummary}</td>
            <td style="font-weight:600; color:var(--green-dark);">₹${o.total.toFixed(2)}</td>
            <td><span class="badge" style="background:#3f7a48;">${o.status}</span></td>
            <td><a href="#/order/${o.id}" class="btn btn-ghost btn-sm" style="padding:4px 8px;">View Details</a></td>
          </tr>
        `;
      });

      appBody.innerHTML = `
        <div class="page-head">
          <h1>My Orders</h1>
        </div>
        <table class="listing-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${orderListHtml}
          </tbody>
        </table>
      `;
    }

    // 7. Auth Pages — Login
    function renderLogin() {
      const params = new URLSearchParams(window.location.hash.split("?")[1] || "");
      const nextPath = params.get("next") || "";

      appBody.innerHTML = `
        <div class="auth-card">
          <h1>Log in</h1>
          <form onsubmit="handleLoginSubmit(event, '${nextPath}')" class="auth-form">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required placeholder="e.g. buyer@farm2market.demo">

            <label>Password</label>
            <input type="password" id="loginPassword" required placeholder="Enter password">

            <button type="submit" class="btn btn-primary btn-block">Log in</button>
          </form>
          
          <div class="auth-switch">
            Don't have an account? <a href="#/signup">Sign up here</a>
          </div>

          <div class="demo-hint">
            <strong>Demo Credentials:</strong><br>
            • Farmer: <code>farmer@farm2market.demo</code> (pw: <code>farmer123</code>)<br>
            • Buyer: <code>buyer@farm2market.demo</code> (pw: <code>buyer123</code>)
          </div>
        </div>
      `;
    }

    function handleLoginSubmit(e, nextPath) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPassword").value;

      const users = getUsers();
      const user = users.find(u => u.email === email && u.password === pass);

      if (user) {
        setSessionUser(user);
        triggerFlash(`Welcome back, ${user.name}!`, "success");
        updateHeader();
        window.location.hash = nextPath ? `#/${nextPath}` : "#/";
      } else {
        triggerFlash("Incorrect email or password.", "error");
      }
    }

    // Auth Pages — Signup
    function renderSignup() {
      appBody.innerHTML = `
        <div class="auth-card">
          <h1>Create Account</h1>
          <form onsubmit="handleSignupSubmit(event)" class="auth-form">
            <label>Your Name</label>
            <input type="text" id="suName" required placeholder="Enter full name">

            <label>Email Address</label>
            <input type="email" id="suEmail" required placeholder="Enter email address">

            <label>Password</label>
            <input type="password" id="suPassword" required placeholder="Choose a password">

            <label>I want to join as a:</label>
            <div class="role-choice">
              <label class="role-option">
                <input type="radio" name="suRole" value="buyer" checked> Buyer (Order produce)
              </label>
              <label class="role-option">
                <input type="radio" name="suRole" value="farmer"> Farmer (List products)
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
          </form>
          
          <div class="auth-switch">
            Already have an account? <a href="#/login">Log in here</a>
          </div>
        </div>
      `;
    }

    function handleSignupSubmit(e) {
      e.preventDefault();
      const name = document.getElementById("suName").value.trim();
      const email = document.getElementById("suEmail").value.trim().toLowerCase();
      const pass = document.getElementById("suPassword").value;
      const role = document.querySelector('input[name="suRole"]:checked').value;

      const users = getUsers();
      if (users.find(u => u.email === email)) {
        triggerFlash("An account with that email already exists.", "error");
        return;
      }

      const newUser = {
        id: users.length + 1,
        name: name,
        email: email,
        password: pass,
        role: role
      };

      users.push(newUser);
      saveUsers(users);

      setSessionUser(newUser);
      triggerFlash(`Welcome to Farm2Market, ${newUser.name}!`, "success");
      updateHeader();
      window.location.hash = role === "farmer" ? "#/dashboard" : "#/";
    }

    // 8. Farmer Dashboard
    function renderDashboard() {
      const user = getSessionUser();
      if (!user || user.role !== "farmer") {
        window.location.hash = "#/login";
        return;
      }

      const prods = getProducts().filter(p => p.farmer_id === user.id);

      let listingsHtml = "";
      if (prods.length > 0) {
        prods.forEach(p => {
          listingsHtml += `
            <tr>
              <td>
                <div class="listing-name">
                  <img src="static/images/${p.image}" alt="${p.name}">
                  <span style="font-weight:600;">${p.name}</span>
                </div>
              </td>
              <td>${p.category}</td>
              <td style="font-weight:600; color:var(--green-dark);">₹${p.price.toFixed(2)}</td>
              <td>${p.stock}</td>
              <td>
                <button onclick="deleteListing(${p.id})" class="btn btn-ghost btn-sm" style="color:var(--error); border-color:var(--border);">Delete</button>
              </td>
            </tr>
          `;
        });
      } else {
        listingsHtml = `
          <tr>
            <td colspan="5" class="empty-state">You don't have any products listed yet. Click "Add New Listing" to begin.</td>
          </tr>
        `;
      }

      appBody.innerHTML = `
        <div class="page-head">
          <h1>Farmer Dashboard</h1>
          <a href="#/products/new" class="btn btn-primary">Add New Listing</a>
        </div>
        
        <h4 style="margin: 0 0 16px 0; text-transform:uppercase; color:var(--dim); font-size:12px;">Active Product Listings</h4>
        <table class="listing-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${listingsHtml}
          </tbody>
        </table>
      `;
    }

    function deleteListing(pid) {
      if (confirm("Are you sure you want to delete this listing?")) {
        const prods = getProducts().filter(p => p.id !== pid);
        saveProducts(prods);
        triggerFlash("Listing removed.", "success");
        renderDashboard();
      }
    }

    // 9. Add Product Form
    function renderNewProduct() {
      const user = getSessionUser();
      if (!user || user.role !== "farmer") {
        window.location.hash = "#/login";
        return;
      }

      appBody.innerHTML = `
        <div class="auth-card" style="max-width:500px;">
          <h1>Add New Listing</h1>
          <p class="dim" style="margin-top:-6px; margin-bottom:20px;">Offer your fresh organic products directly to buyers.</p>
          
          <form onsubmit="handleNewProductSubmit(event)" class="auth-form">
            <label>Product Name</label>
            <input type="text" id="npName" required placeholder="e.g. Organic Strawberries">

            <label>Category</label>
            <select id="npCategory">
              <option value="Dairy & Eggs">Dairy & Eggs</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Bakery">Bakery</option>
              <option value="Grains">Grains</option>
              <option value="Other">Other</option>
            </select>

            <label>Description</label>
            <textarea id="npDescription" rows="3" placeholder="Tell buyers about your harvest..."></textarea>

            <label>Price (per unit in ₹)</label>
            <input type="number" id="npPrice" step="0.01" min="0.01" required placeholder="e.g. 5.99">

            <label>Stock Quantity Available</label>
            <input type="number" id="npStock" min="1" required placeholder="e.g. 50">

            <label>Product Image Mockup</label>
            <select id="npImage">
              <option value="WD-eggs.jpg">Farm Fresh Eggs (Dairy)</option>
              <option value="WD-bananas.jpg">Ripe Bananas (Fruits)</option>
              <option value="WD-Tomatos.jpg">Vine Tomatoes (Vegetables)</option>
              <option value="WD-Bread.jpg">Whole Wheat Bread (Bakery)</option>
              <option value="WD-Cheese.jpg">Farmstead Cheese (Dairy)</option>
              <option value="WD-Milk.jpg">Whole Milk (Dairy)</option>
              <option value="WD-Pears.jpg">Organic Pears (Fruits)</option>
              <option value="WD-Rice.jpg">Basmati Rice (Grains)</option>
              <option value="WD-potatoes.jpg">Baby Potatoes (Vegetables)</option>
            </select>

            <button type="submit" class="btn btn-primary btn-block">List Product</button>
          </form>
          
          <a href="#/dashboard" class="back-link" style="margin-top:16px; display:block; text-align:center;">← Cancel and Back</a>
        </div>
      `;
    }

    function handleNewProductSubmit(e) {
      e.preventDefault();
      const user = getSessionUser();
      const prods = getProducts();

      const name = document.getElementById("npName").value.trim();
      const category = document.getElementById("npCategory").value;
      const desc = document.getElementById("npDescription").value.trim();
      const price = parseFloat(document.getElementById("npPrice").value) || 0.0;
      const stock = parseInt(document.getElementById("npStock").value) || 0;
      const img = document.getElementById("npImage").value;

      if (!name || price <= 0 || stock <= 0) {
        triggerFlash("Please enter valid product data.", "error");
        return;
      }

      const newId = prods.reduce((max, p) => p.id > max ? p.id : max, 0) + 1;
      const product = {
        id: newId,
        name: name,
        category: category,
        description: desc,
        price: price,
        stock: stock,
        image: img,
        farmer_id: user.id
      };

      prods.push(product);
      saveProducts(prods);

      triggerFlash(`'${product.name}' is now listed.`, "success");
      window.location.hash = "#/dashboard";
    }
  </script>
</body>
</html>
